name: Update metrics card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-card
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Metrics card
        uses: RealBlackB1RD/metrics@0c3b9623972034d3225856408491fb8887935233
        with:
          token: ${{ secrets.STATS_TOKEN }}
          user: RealBlackB1RD
          filename: assets/metrics.svg
          template: classic
          config_display: large
          base: header, activity, repositories
          repositories_affiliations: owner, organization_member
          commits_authoring: BlackB1RD
          config_timezone: Asia/Jerusalem
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_analysis_timeout: 30
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_delay: 10
          committer_message: "Update metrics card"
